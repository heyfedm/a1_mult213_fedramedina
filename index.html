<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder - Hey Fed</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Chewy&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Chewy&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>Recipe Finder by Hey Fed</h1>
        <div class="searchbox">
            <input type="text" id="ingredientInput" placeholder="Enter an Ingredient" aria-label="Enter an Ingredient">
            <button id="searchbutton">Search</button>
            <button id="randombutton" class="random">Suprise Me!</button>
        </div>
    </header>

    <main>
        <div id="errormessage" class="error"></div>

        <!--Ingredients and intructions-->
        <div id="intructions" class="intructionscont"></div>

        <!--grid for the results-->
        <div id="list" class="listgrid"></div>
    </main>

    <script src="app.js"></script>
</body>

</html>
